<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Portfolio sharing image source</title>
<style>

  body { margin: 0; width: 1200px; height: 630px; background: #0c1a20; color: #edf6f5; font-family: Arial, sans-serif; }
  main { padding: 66px 76px; height: 100%; position: relative; overflow: hidden; }
  main::after { content: ''; position: absolute; width: 390px; height: 390px; border: 1px solid #21444b; border-radius: 50%; right: -160px; top: -150px; }
  .name { font-size: 32px; font-weight: 600; margin: 0 0 48px; letter-spacing: -1px; }
  h1 { font-size: 65px; line-height: 1.08; letter-spacing: -2.5px; margin: 0; max-width: 1000px; }
  h1 span { display: block; }
  .flutter { color: #65d2c2; }
  .ios { font-size: 47px; line-height: 1.3; margin-top: 14px; }
  .platforms { margin: 33px 0 0; color: #adc5cc; font-size: 23px; }
  footer { position: absolute; bottom: 50px; left: 76px; right: 76px; display: flex; justify-content: space-between; border-top: 1px solid #29434a; padding-top: 20px; color: #adc5cc; font-size: 19px; }
</style>
<main>
  <p class="name">İlker Sevim</p>
  <h1><span class="flutter">Flutter Cross-Platform</span><span class="flutter">Developer</span><span class="ios">&amp; Senior iOS Engineer</span></h1>
  <p class="platforms">Flutter · Apple · Android &amp; React personal projects</p>
  <footer><span>Remote from Istanbul, Türkiye · Hybrid in Istanbul</span><span>ilkersevim.github.io</span></footer>
</main>
</html>
