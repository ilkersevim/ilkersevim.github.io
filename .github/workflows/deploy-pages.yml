name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm build
      # Org site: publish the real app at https://ilkersevim.github.io/
      - uses: actions/upload-pages-artifact@v5
        if: >-
          github.repository == 'ilkersevim/ilkersevim.github.io' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: dist
          include-hidden-files: true
      # Legacy user site: redirect https://redjadet.github.io/ → org site
      - uses: actions/upload-pages-artifact@v5
        if: >-
          github.repository == 'redjadet/redjadet.github.io' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: redirect-usersite
          include-hidden-files: true
      # Project site: redirect https://redjadet.github.io/react-web-portfolio/ → org site
      - uses: actions/upload-pages-artifact@v5
        if: >-
          github.repository == 'redjadet/react-web-portfolio' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: redirect-pages
          include-hidden-files: true

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
